[project]
name = "displacement-analysis"
version = "0.1.0"
description = "Exploratory analysis of displacement patterns in the Gaza Strip using tent prediction coverage data and related spatial context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz",
    "astral",
    "geopandas",
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "rasterio",
    "requests",
    "pymc",
    "pytensor",
    "scipy",
    "scikit-learn",
    "shapely",
    "tifffile",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
